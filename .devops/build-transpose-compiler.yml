variables:
  compiler: '$(Build.SourcesDirectory)/Transpose/Transpose.Compiler/Transpose.Compiler.csproj'
  bench: '$(Build.SourcesDirectory)/Transpose/Transpose.Bench/Transpose.Bench.csproj'
  translatorTests: '$(Build.SourcesDirectory)/Transpose/Transpose.Translator.Tests/Transpose.Translator.Tests.csproj'
  watchModeTests: '$(Build.SourcesDirectory)/Transpose/Transpose.WatchMode.Tests/Transpose.WatchMode.Tests.csproj'
  bcl: '$(Build.SourcesDirectory)/BCL/Transpose.BCL/Transpose.BCL.csproj'
  bclRuntimeDll: '$(Build.SourcesDirectory)/BCL/Transpose.BCL/bin/Release/netstandard2.0/Transpose.dll'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# ReadyToRun-compiling the tool is worth ~1 s off *every* `tps` invocation (a one-file project goes
# 2.2 s -> 1.1 s; a clean Tesserae build -11%), and the SDK runs tps once per project, so it multiplies
# across a solution. R2R is native code, so it needs RID-specific tool packages: the csproj's
# TransposePackRidSpecificTools property turns on RuntimeIdentifiers + PublishReadyToRun, and a single
# `dotnet pack` then produces one Transpose.Compiler.<rid> package per RID plus the small outer
# Transpose.Compiler package that maps RIDs to them. `dotnet tool install Transpose.Compiler` keeps
# working unchanged and resolves the right one automatically.
#
# Pool is a Linux host: it was verified end-to-end to cross-compile R2R for all nine RIDs
# (win/linux/osx x x64/arm64/x86/musl) from a single pack. Any host should manage it — crossgen2 targets
# a RID rather than the host — but this is the configuration with evidence behind it. The verify step
# below fails the build if R2R is ever silently lost, whatever the agent.
#
# Pinned to 22.04, *not* ubuntu-latest: the NuGetCommand@2 push at the end of this file runs on Mono,
# and the hosted images dropped Mono in 24.04, so ubuntu-latest fails the push with
# "you are using Ubuntu 24.04 or later without mono installed" (https://aka.ms/nuget-task-mono).
# If this image is ever retired, the fix is to replace that task with a `dotnet nuget push`, which
# needs no Mono — do not just bump the image back to latest.
pool:
  vmImage: 'ubuntu-22.04'

trigger:
  branches:
    include:
    - master
  paths:
    include:
    - Transpose/Transpose.Compiler/*
    - Transpose/Transpose.Translator/*
    - Transpose/Transpose.Bench/*
    - Transpose/Transpose.Translator.Tests/*
    - Transpose/Transpose.WatchMode.Tests/*
    - .devops/build-transpose-compiler.yml

pr: none

steps:
- checkout: self

- script: |
    echo "Commit message: $(Build.SourceVersionMessage)"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

# Restore has to see the same property as the pack: TransposePackRidSpecificTools sets
# RuntimeIdentifiers, and without it in the restore the per-RID assets are missing and every inner
# build fails with NETSDK1047.
- task: DotNetCoreCLI@2
  displayName: 'restore nuget compiler (all RIDs)'
  inputs:
    command: 'restore'
    projects: '$(compiler)'
    arguments: '-p:TransposePackRidSpecificTools=true'

- task: DotNetCoreCLI@2
  displayName: 'build compiler'
  inputs:
    command: 'build'
    projects: '$(compiler)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion)'

# --- tests ------------------------------------------------------------------------------------
# Everything below runs before the pack/push, so a red test never reaches nuget.org.
#
# Two suites, both needing something the compiler build alone does not provide:
#   * Transpose.Translator.Tests transpiles snippets and runs them on Node, diffing the output against
#     the same C# executed natively — so it needs Node, and a Transpose.dll to compile against.
#   * Transpose.WatchMode.Tests drives a real headless Chromium against a real `tps --watch` server —
#     so it needs the Playwright browser installed.

- task: NodeTool@0
  displayName: 'Use Node 22 (the translator tests run emitted JS on it)'
  inputs:
    versionSpec: '22.x'

# Every compilation gets Transpose.dll as its sole BCL reference, and nothing in this pipeline restores
# the published Transpose.BCL package. Build it here with the compiler just built, and point the tests
# at it via TRANSPOSE_DLL_PATH: that both makes them runnable and means they exercise *this commit's*
# BCL and runtime rather than whatever was last released.
- script: |
    set -euo pipefail
    dotnet "$(Build.SourcesDirectory)/Transpose/Transpose.Compiler/bin/$(buildConfiguration)/net10.0/tps.dll" \
      --project "$(bcl)" --build-runtime -c $(buildConfiguration) -o "$(bclRuntimeDll)"
    test -f "$(bclRuntimeDll)"
    echo "##vso[task.setvariable variable=TRANSPOSE_DLL_PATH;]$(bclRuntimeDll)"
  displayName: 'build the Transpose.dll runtime the tests compile against'


# ####### Tests disabled for now on CI, devops is resources limited  ########
