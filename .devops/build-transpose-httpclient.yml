variables:
  transposeHttpClient: '$(Build.SourcesDirectory)/Packages/Transpose.HttpClient/Transpose.HttpClient.csproj'
  transposeHttpClientTests: '$(Build.SourcesDirectory)/Packages/Transpose.HttpClient.Tests/Transpose.HttpClient.Tests.csproj'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

pool:
  vmImage: 'windows-latest'

trigger:
  branches:
    include:
    - master
  paths:
    include:
    - Packages/Transpose.HttpClient/*
    - Packages/Transpose.HttpClient.Tests/*
    - .devops/build-transpose-httpclient.yml

pr: none

steps:
- checkout: self

- script: |
    echo "Commit message: $(Build.SourceVersionMessage)"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: CmdLine@2
  displayName: 'Install Transpose compiler'
  inputs:
    script: 'dotnet tool install --global Transpose.Compiler'

- task: DotNetCoreCLI@2
  displayName: 'restore nuget'
  inputs:
    command: 'restore'
    projects: '$(transposeHttpClient)'

- task: DotNetCoreCLI@2
  displayName: 'build'
  inputs:
    command: 'build'
    projects: '$(transposeHttpClient)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion)'

# TESTS DISABLED ON CI DUE TO RESOURCE LIMITATION
# Runs each snippet as translated JavaScript on Node against a fake XMLHttpRequest, and — for the part
# of the surface that has one — diffs it against the real System.Net.Http in the shared framework. The
# suite compiles Transpose.Core and the package itself in-process, so it also catches the package
# failing to transpile at all.
# - task: DotNetCoreCLI@2
#   displayName: 'test'
#   inputs:
#     command: 'test'
#     projects: '$(transposeHttpClientTests)'
#     arguments: '-c $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'pack nuget'
  inputs:
    command: 'pack'
    packagesToPack: '$(transposeHttpClient)'
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    buildProperties: 'Version="$(targetVersion)";AllowUnsafeBlocks="True";LangVersion="latest"'

- task: NuGetCommand@2
  displayName: 'push nuget'
  inputs:
    command: 'push'
    packagesToPush: '**/Transpose.HttpClient.$(targetVersion).nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
